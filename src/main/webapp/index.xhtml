<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>JSF PrimeFaces + Spring 6</title>
    <h:outputStylesheet name="css/style.css" />
</h:head>
<h:body>
    <h:form>
        <div class="container">
            <h1>JSF PrimeFaces + Spring 6 + Oracle</h1>

            <p:panel header="User Form" style="width:400px; margin:20px auto;">
                <h:panelGrid columns="2" cellpadding="5">
                    <h:outputLabel for="name" value="Name:" />
                    <p:inputText id="name" value="#{userBean.name}" placeholder="Enter your name" />

                    <h:outputLabel for="email" value="Email:" />
                    <p:inputText id="email" value="#{userBean.email}" placeholder="Enter your email" />
                </h:panelGrid>

                <div style="text-align:center; margin-top:15px;">
                    <p:commandButton value="Submit" action="#{userBean.submit()}" update="result" />
                    <p:commandButton value="Reset" action="#{userBean.reset()}" immediate="true" style="margin-left:10px;" />
                </div>
            </p:panel>

            <p:panel id="result" header="Result" rendered="#{userBean.submitted}" style="width:400px; margin:20px auto;">
                <h:panelGrid columns="2" cellpadding="5">
                    <h:outputLabel value="Name:" />
                    <h:outputText value="#{userBean.name}" />

                    <h:outputLabel value="Email:" />
                    <h:outputText value="#{userBean.email}" />

                    <h:outputLabel value="Message:" />
                    <h:outputText value="#{userBean.message}" />
                </h:panelGrid>
            </p:panel>
        </div>
    </h:form>
</h:body>
</html>
